# 故事书 - 阿里云 Nginx 配置
# 部署位置：/etc/nginx/conf.d/storybook.conf
# 把下面所有 YOUR_DOMAIN 替换成你的备案域名（例如 story.yourname.com）

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Certbot 申请证书用（申请时会自动写入，先留着）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 前端静态文件（部署时把 frontend/dist 放到这里）
    root /var/www/storybook;
    index index.html;

    # SPA：所有前端路由都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：/api/* 原样转发到本机 3000 端口的 Node 服务
    # 注意 proxy_pass 末尾不要加 /，否则 /api 前缀会被吞掉
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # TTS 合成本地可能慢，放宽超时
    }
}
