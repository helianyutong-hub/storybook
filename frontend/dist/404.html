<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>睡前故事绘本</title>
  <script>
    // SPA: 所有路径重定向到 /storybook/ 让前端路由处理
    var p = location.pathname;
    if (p.indexOf('/storybook/') !== 0) {
      location.replace('/storybook/' + p.replace(/^\//, ''));
    } else {
      location.replace('/storybook/' + p.replace(/^\/storybook\//, ''));
    }
  </script>
</head>
<body>
  <p>页面跳转中…</p>
</body>
</html>
