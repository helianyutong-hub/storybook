# Render Blueprint：在 Render 用 GitHub 登录后「New」→「Blueprint」连接本仓库，
# 即自动按此文件部署后端（无需手动配置）。免费额度即可运行。
services:
  - type: web
    name: storybook-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://helianyutong-hub.github.io
      # 以下三项为可选：填了才有大模型完整剧情，留空则回退本地模板
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      # 以下为可选：填了才有阿里云 CosyVoice 音色区分（爸爸/妈妈/爷爷/奶奶各不相同）
      # 不填则回退 Edge TTS，功能照常，只是四个音色听起来差不多
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_WORKSPACE_ID
        sync: false
      - key: ALIYUN_TTS_MODEL
        sync: false
