# 故事书后端 - 阿里云部署
# 用法：在 backend/ 目录下执行  docker compose up -d --build
services:
  backend:
    build: .
    container_name: storybook-backend
    restart: unless-stopped
    # 只暴露给本机，由宿主机 nginx 反代出去（不直接对外）
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PREFIX=/api
      - CORS_ORIGIN=*
      - LOG_LEVEL=info
      # 阿里云百炼语音合成（CosyVoice）：从 backend/.env 读取
      # 不配也能跑，会自动回退到 Edge TTS，只是音色区分度差
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_WORKSPACE_ID=${DASHSCOPE_WORKSPACE_ID:-}
      - ALIYUN_TTS_MODEL=${ALIYUN_TTS_MODEL:-cosyvoice-v3-flash}
    volumes:
      # 持久化故事/用户数据 + 语音缓存（都在 data/ 下，重建容器不会丢）
      - ./data:/app/data
